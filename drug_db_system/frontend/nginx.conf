server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Excel 导入可能较大
    client_max_body_size 200m;

    # ---------- Let's Encrypt 验证（certbot webroot）----------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------- 导出（CSV 流式下载，必须放在 /api/ 之前）----------
    # CSV 是未压缩文本、单份可能几百 MB，这里做四件事：
    #   1. proxy_buffering off：否则 nginx 会先把整份响应落到临时文件再转发，
    #      小盘机器可能被一个大导出写满 /tmp，首字节延迟也会变高；
    #   2. 客户端中断时立即断开上游，避免后端导出白跑（白跑会一直占着闸门名额）；
    #   3. text/csv 开 gzip：CSV 文本压缩率很高，能省一大截公网流量；
    #   4. 读超时放宽到 30 分钟，覆盖「语句超时 10 分钟」的最坏情况，
    #      否则 Nginx 会在 600s 处先掐断长导出。
    location ~ ^/api/.+/export {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        gzip on;
        gzip_proxied any;
        gzip_types text/csv text/plain;
        gzip_min_length 1024;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ---------- 健康检查 / 接口文档 ----------
    location = /health {
        proxy_pass http://api:8000/api/health;
    }
    location /docs {
        proxy_pass http://api:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # ---------- SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
